; Mini Dash firmware. Toolchain pinned from the Waveshare 4.3C repo's config/ci.json
; (Arduino core 3.3.11, via the pioarduino platform release 55.03.311) with the FQBN
; options mapped to PlatformIO board overrides below. Change nothing here without
; checking CLAUDE.md section 2.
;
; Why pioarduino: the official platformio/espressif32 platform stopped at Arduino core 2.x.
; Why Python 3.10 to 3.14: the platform's build scripts refuse other versions; PlatformIO
; is installed in ~/.platformio/penv on Homebrew python@3.12 (docs/decisions.md 2026-10-24).

[platformio]
default_envs = minidash-xip

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; CPUFreq=240
board_build.f_cpu = 240000000L
; FlashMode=qio, FlashSize=16M
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; PartitionScheme=app3M_fat9M_16MB
board_build.partitions = app3M_fat9M_16MB.csv
; PSRAM=opi (ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash, 8 MB OPI PSRAM)
board_build.arduino.memory_type = qio_opi
; UploadSpeed=921600
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DBOARD_HAS_PSRAM
    ; USBMode=hwcdc, CDCOnBoot=cdc (native USB, no UART bridge on the 4.3C)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LoopCore=1, EventsCore=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DCORE_DEBUG_LEVEL=3
    ; LVGL reads include/lv_conf.h (Waveshare's, adapted; see the file header)
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Wall
lib_deps =
    lvgl/lvgl @ 8.4.0
    sparkfun/SparkFun u-blox GNSS v3 @ 3.1.15
    sparkfun/SparkFun 6DoF ISM330DHCX @ 1.0.6
    adafruit/Adafruit VEML7700 Library @ 2.1.6
    adafruit/Adafruit BusIO @ 1.17.4
; The VEML7700 library declares SSD1306 (and so GFX) as dependencies for its examples only.
lib_ignore =
    Adafruit SSD1306
    Adafruit GFX Library

; Phase 3b onward: the product firmware (splash, shell, pages, sensors, demo replay) on the
; prebuilt Arduino core. Kept as the fallback that needs no framework rebuild; on it, flash
; writes are deferred to standstills and event traces held back (src/main.cpp).
[env:minidash]
build_src_filter = +<*> -<bringup/>

; The product firmware on a framework rebuilt with code and read-only data executing from
; PSRAM and the RGB panel's refill interrupt IRAM-safe, so a flash write no longer stalls the
; panel (Espressif's recommendation for RGB LCDs with PSRAM frame buffers). Proven on the bench
; 24 Oct 2026: a write stalls PSRAM access for 1.5 to 1.8 ms (idle jitter) against 19 to 20 ms
; on the prebuilt core; see docs/test-log.md. This is the default env. pioarduino rebuilds the
; Arduino libraries from ESP-IDF for it ("hybrid build"): the first build fetches ESP-IDF 5.5.5
; and takes about three minutes, and every switch between this env and env minidash swaps the
; libraries package and rebuilds it again. The hybrid build ignores build_src_filter (the
; bring-up program guards itself with MINIDASH_BRINGUP instead) and needs the partition CSV in
; the project folder. It also needs a one-line per-machine fix to the platform's platform.json
; before it will link; firmware/README.md, "Framework rebuild".
[env:minidash-xip]
extends = env:minidash
build_flags = ${env.build_flags} -DMINIDASH_XIP
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y

; Phase 3a: board bring-up. I2C scan, backlight ramp, GPS, IMU, lux, printed once a second.
[env:bringup]
build_src_filter = +<*> -<app/> -<ui/> -<main.cpp> +<bringup/>
build_flags = ${env.build_flags} -DMINIDASH_BRINGUP
